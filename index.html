<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Бібліотека — Лабораторна робота</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Бібліотека</h1>

    <div class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="books">Книги</button>
        <button class="tab-btn" data-tab="readers">Читачі</button>
        <button class="tab-btn" data-tab="loans">Видачі книг</button>
    </div>

    <div class="tab-content active" id="books">
        <h2>Книги</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Назва</th>
                    <th>Автор</th>
                    <th>Рік видання</th>
                    <th>Жанр</th>
                    <th>ISBN</th>
                    <th>Кількість сторінок</th>
                    <th>У наявності</th>
                </tr>
            </thead>
            <tbody id="books-body"></tbody>
        </table>
    </div>

    <div class="tab-content" id="readers">
        <h2>Читачі</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ПІБ</th>
                    <th>Дата народження</th>
                    <th>Телефон</th>
                    <th>Email</th>
                    <th>Адреса</th>
                    <th>Номер квитка</th>
                    <th>Дата реєстрації</th>
                </tr>
            </thead>
            <tbody id="readers-body"></tbody>
        </table>
    </div>

    <div class="tab-content" id="loans">
        <h2>Видачі книг</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Читач</th>
                    <th>Книга</th>
                    <th>Дата видачі</th>
                    <th>Дата повернення (план)</th>
                    <th>Дата повернення (факт)</th>
                    <th>Статус</th>
                </tr>
            </thead>
            <tbody id="loans-body"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
